[workspace]
resolver = "2"
members = ["crates/tccl"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LucasBolla94/tccl"
homepage = "https://tccl.the-coin.cloud"
rust-version = "1.88"

[workspace.dependencies]
borsh = { version = "1.5", features = ["derive"] }
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = "2.1"
bech32 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
