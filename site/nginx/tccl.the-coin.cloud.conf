# nginx configuration for https://tccl.the-coin.cloud (static site + WebAssembly playground).
#   sudo cp tccl.the-coin.cloud.conf /etc/nginx/sites-available/tccl.the-coin.cloud
#   sudo ln -s /etc/nginx/sites-available/tccl.the-coin.cloud /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d tccl.the-coin.cloud
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo cp tccl-headers.conf /etc/nginx/snippets/
# Releases live in /var/www/tccl-releases/<version>; /var/www/tccl.the-coin.cloud is a symlink to the current one.

server {
    listen 80;
    listen [::]:80;
    server_name tccl.the-coin.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tccl.the-coin.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tccl.the-coin.cloud;

    ssl_certificate     /etc/letsencrypt/live/tccl.the-coin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tccl.the-coin.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tccl.the-coin.cloud;
    index index.html;
    charset utf-8;
    disable_symlinks off;
    error_page 404 /404.html;

    # No third-party resources. The playground compiles WebAssembly and runs it in a worker.
    include snippets/tccl-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain application/xml;

    client_max_body_size 1k;

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg;
        font/woff2 woff2;
        text/plain txt tccl scenario sh ps1;
        application/xml xml;
    }

    location ~ ^/install\.(sh|ps1)$ {
        limit_except GET HEAD { deny all; }
        include snippets/tccl-headers.conf;
        add_header Cache-Control "no-cache";
    }
    # Content-hashed engine: cache forever.
    location /engine/ {
        limit_except GET HEAD { deny all; }
        include snippets/tccl-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Versioned assets (?v=hash in HTML).
    location /assets/ {
        limit_except GET HEAD { deny all; }
        include snippets/tccl-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        limit_except GET HEAD { deny all; }
        include snippets/tccl-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
    location ~ /\. { deny all; }
}
